<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixed Five Layer Directed Graph</title>
  <style>
    :root {
      --ink: #141414;
      --paper: #fbfbf7;
      --grid: #dcded8;
      --blue: #27336b;
      --green: #57bd84;
      --warm: #f6f1e7;
      --line: #5f676d;
      --muted: #68706a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--paper);
      background-size: 20px 20px;
      font-family: "Aptos", "Microsoft YaHei", sans-serif;
    }

    .stage {
      width: min(1480px, calc(100vw - 20px));
      min-width: 1240px;
      margin: 8px auto 4px;
      padding: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      margin: 0 4px 8px;
      padding: 0 14px;
      border: 1px solid rgba(39, 51, 107, 0.5);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 1px 0 rgba(20, 20, 20, 0.05);
    }

    .toolbar-title {
      color: #1f2a5c;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .version-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .version-control select {
      min-width: 148px;
      height: 30px;
      padding: 0 30px 0 10px;
      color: var(--ink);
      border: 1px solid rgba(20, 20, 20, 0.55);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      font: inherit;
      cursor: pointer;
    }

    .overview-flow {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      margin: 0 4px 9px;
    }

    .overview-inner {
      grid-column: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      border: 1px solid rgba(39, 51, 107, 0.56);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.62);
    }

    .overview-node {
      display: inline-grid;
      place-items: center;
      min-width: 132px;
      height: 35px;
      padding: 0 18px;
      border: 1px solid rgba(20, 20, 20, 0.72);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    .overview-arrow {
      position: relative;
      width: 54px;
      height: 14px;
      flex: 0 0 54px;
    }

    .overview-arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 7px;
      top: 6px;
      height: 1.3px;
      background: #5f676d;
    }

    .overview-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 2px;
      border-left: 8px solid #5f676d;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .graph {
      position: relative;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      grid-template-rows: 104px 62px 62px 304px 80px;
      gap: 10px 10px;
      min-height: 652px;
      padding: 0 4px;
    }

    .edge-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: visible;
    }

    .layer {
      position: relative;
      display: grid;
      grid-column: 2;
      align-items: center;
      border: 1px solid var(--blue);
      border-radius: 7px;
      background: rgba(251, 251, 247, 0.78);
      box-shadow: 0 1px 0 rgba(20, 20, 20, 0.04);
    }

    .layer[data-frame="false"] {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .layer[data-id="layer.modules"],
    .layer-label[data-layer-id="layer.modules"] {
      margin-top: 12px;
    }

    .layer-frame-title {
      position: absolute;
      top: -17px;
      left: 50%;
      z-index: 36;
      transform: translateX(-50%);
      padding: 0 14px;
      color: #000;
      background: var(--paper);
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .layer-label {
      position: relative;
      z-index: 40;
      display: grid;
      align-items: center;
      justify-items: end;
      padding-right: 10px;
      color: #1f2a5c;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      text-align: right;
      letter-spacing: 0;
      white-space: pre-line;
    }

    .row {
      display: grid;
      align-items: center;
      justify-items: center;
      width: 100%;
      height: 100%;
      padding: 7px 12px;
      column-gap: 10px;
    }

    .modules-row {
      display: grid;
      grid-template-columns: repeat(var(--module-count), minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      height: 100%;
      padding: 28px 16px 14px;
      align-items: stretch;
    }

    .modules-row.has-sequence {
      column-gap: 6px;
    }

    .module-sequence-arrow {
      position: relative;
      z-index: 34;
      display: grid;
      place-items: center;
      align-self: center;
      justify-self: center;
      width: 38px;
      height: 42px;
      color: rgba(31, 42, 92, 0.72);
      pointer-events: none;
    }

    .module-sequence-arrow svg {
      width: 38px;
      height: 30px;
      fill: currentColor;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.75));
    }

    .node {
      position: relative;
      display: inline-grid;
      place-items: center;
      z-index: 30;
      color: var(--ink);
      border: 1px solid var(--ink);
      background: rgba(255, 255, 255, 0.92);
      font-size: 15.5px;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: pre-line;
      text-align: center;
      user-select: none;
    }

    .asset-clickable {
      cursor: pointer;
    }

    .asset-clickable:hover {
      outline: 2px solid rgba(49, 92, 143, 0.18);
      outline-offset: 3px;
    }

    .node.ellipse {
      width: 176px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      padding: 0 14px;
    }

    .node.stage-output {
      display: grid;
      grid-template-rows: minmax(18px, auto) 68px;
      row-gap: 1px;
      width: 188px;
      height: 92px;
      padding: 2px 8px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .stage-output-label {
      display: grid;
      align-items: center;
      min-width: 0;
      color: #1b234f;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.12;
      white-space: normal;
    }

    .stage-output-icon {
      display: grid;
      place-items: center;
      justify-self: center;
      width: 76px;
      height: 66px;
      color: #315c8f;
    }

    .stage-output-icon svg {
      width: 60px;
      height: 60px;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .node.stage-output[data-icon="radar"] .stage-output-icon {
      color: #2f6f91;
    }

    .node.stage-output[data-icon="document"] .stage-output-icon {
      color: #6a5a9e;
    }

    .node.stage-output[data-icon="blueprint"] .stage-output-icon {
      color: #1f6c9d;
    }

    .node.stage-output[data-icon="code"] .stage-output-icon {
      color: #9a6338;
    }

    .node.stage-output[data-icon="merge"] .stage-output-icon {
      color: #33715c;
    }

    .node.rect.small {
      width: 148px;
      height: 32px;
      border-radius: 7px;
    }

    .node.rect.medium {
      width: 126px;
      height: 40px;
      border-radius: 7px;
      padding: 0 8px;
    }

    .module {
      position: relative;
      min-width: 0;
      border: 1px solid var(--blue);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    }

    .module-title {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 12px;
      background: var(--paper);
      font-size: 19px;
      line-height: 1;
      font-weight: 700;
      color: #000;
      white-space: nowrap;
      z-index: 35;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(32px, 1fr));
      align-items: center;
      justify-items: center;
      height: 100%;
      padding: 24px 14px 12px;
    }

    .node.text {
      border: 0;
      background: transparent;
      min-width: 34px;
      min-height: 22px;
      padding: 2px 4px;
      max-width: min(86px, 100%);
      font-size: 15px;
      font-weight: 500;
      z-index: 30;
      overflow-wrap: anywhere;
    }

    .node.text.loop-node {
      font-weight: 600;
    }

    .loop-badge {
      position: absolute;
      top: -13px;
      left: -16px;
      color: #8a4b08;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .edge {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .loop-edge {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .asset-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(20, 20, 20, 0.28);
    }

    .asset-modal.is-open {
      display: flex;
    }

    .asset-dialog {
      width: min(680px, calc(100vw - 44px));
      max-height: min(720px, calc(100vh - 44px));
      overflow: hidden;
      border: 1px solid rgba(39, 51, 107, 0.42);
      border-radius: 8px;
      background: rgba(251, 251, 247, 0.98);
      box-shadow: 0 18px 50px rgba(20, 20, 20, 0.22);
    }

    .asset-dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(39, 51, 107, 0.18);
    }

    .asset-dialog-kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .asset-dialog-title {
      margin-top: 5px;
      color: #1b234f;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .asset-close {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      color: #27336b;
      border: 1px solid rgba(39, 51, 107, 0.25);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.68);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .asset-dialog-body {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 11px 16px;
      max-height: calc(min(720px, 100vh - 44px) - 92px);
      overflow: auto;
      padding: 16px 20px 20px;
      font-size: 14px;
      line-height: 1.45;
    }

    .asset-field-label {
      color: #4e5a65;
      font-weight: 700;
      text-align: right;
    }

    .asset-field-value {
      min-width: 0;
      color: #1f2428;
    }

    .asset-empty {
      color: #8a9298;
      font-weight: 700;
    }

    .asset-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .asset-tag,
    .asset-status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .asset-tag {
      color: #27336b;
      background: rgba(39, 51, 107, 0.08);
      border: 1px solid rgba(39, 51, 107, 0.12);
    }

    .asset-status.done {
      color: #136c3d;
      background: rgba(87, 189, 132, 0.18);
      border: 1px solid rgba(87, 189, 132, 0.35);
    }

    .asset-status.todo {
      color: #646b70;
      background: rgba(95, 103, 109, 0.14);
      border: 1px solid rgba(95, 103, 109, 0.2);
    }

    .asset-links {
      display: grid;
      gap: 6px;
    }

    .asset-links a {
      color: #1f6c9d;
      font-weight: 700;
      text-decoration: none;
    }

    .asset-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1040px) {
      .stage {
        width: 100vw;
        min-width: 1180px;
        margin: 10px 0;
      }

      .graph {
        padding: 0 4px;
      }

      .modules-row {
        gap: 18px;
        padding-left: 30px;
        padding-right: 30px;
      }

      .modules-row.has-sequence {
        column-gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="toolbar" aria-label="graph toolbar">
      <div class="toolbar-title">研发流程图</div>
      <label class="version-control" for="version-select">
        <span>版本</span>
        <select id="version-select"></select>
      </label>
    </section>
    <section id="overview-flow" class="overview-flow" aria-label="top direction flow"></section>
    <section id="graph" class="graph" aria-label="fixed five layer directed graph">
      <svg id="edge-layer" class="edge-layer" aria-hidden="true"></svg>
    </section>
  </main>

  <div id="asset-modal" class="asset-modal" role="dialog" aria-modal="true" aria-labelledby="asset-dialog-title">
    <section class="asset-dialog">
      <header class="asset-dialog-header">
        <div>
          <div class="asset-dialog-kicker">Asset Detail</div>
          <div id="asset-dialog-title" class="asset-dialog-title"></div>
        </div>
        <button id="asset-close" class="asset-close" type="button" aria-label="关闭">×</button>
      </header>
      <div id="asset-dialog-body" class="asset-dialog-body"></div>
    </section>
  </div>

    { "id": "e.execute-jjj-mmmmm", "from": "execute.jjj", "to": "execute.mmmmm", "color": "#18a55f", "direction": "right" },
    { "id": "e.execute-lll-mmmmm", "from": "execute.lll", "to": "execute.mmmmm", "color": "#171717", "direction": "left" },

    { "id": "e.understand-output3", "from": "understand.bbb", "to": "output.3", "color": "#18a55f", "direction": "down" },
    { "id": "e.plan-output4", "from": "plan.eeeee", "to": "output.4", "color": "#18a55f", "direction": "down" },
    { "id": "e.execute-output5", "from": "execute.jjj", "to": "output.5", "color": "#18a55f", "direction": "down" },
    { "id": "e.execute-output6", "from": "execute.mmmmm", "to": "output.6", "color": "#18a55f", "direction": "down" },
    { "id": "e.execute-output7", "from": "execute.iii", "to": "output.7", "color": "#18a55f", "direction": "down" }
  ]
}
  </script>

  <script>
    const overviewEl = document.querySelector("#overview-flow");
    const graphEl = document.querySelector("#graph");
    const svgEl = document.querySelector("#edge-layer");
    const versionSelect = document.querySelector("#version-select");
    const assetModal = document.querySelector("#asset-modal");
    const assetTitleEl = document.querySelector("#asset-dialog-title");
    const assetBodyEl = document.querySelector("#asset-dialog-body");
    const assetCloseEl = document.querySelector("#asset-close");
    const nodeIndex = new Map();
    const namespace = "http://www.w3.org/2000/svg";
    const phaseByModule = {
      "module.understand": "理解",
      "module.plan": "规划",
      "module.execute": "执行",
      "module.verify": "验证"
    };
    const defaultGraphSources = [
      {
        id: "real",
        label: "RTOS NEXT",
        url: "graph-data.json",
        fallbackKey: "FALLBACK_GRAPH_DATA",
        inlineFallback: true
      },
      {
        id: "mock",
        label: "Mock 数据 Demo",
        url: "graph-data.mock.json",
        fallbackKey: "MOCK_GRAPH_DATA"
      }
    ];
    const graphVariants = Array.isArray(window.GRAPH_DATA_SOURCES) && window.GRAPH_DATA_SOURCES.length
      ? window.GRAPH_DATA_SOURCES
      : defaultGraphSources;
    const graphCache = new Map();
    let graphData;

    async function loadGraphData(variant) {
      if (graphCache.has(variant.id)) return graphCache.get(variant.id);

      try {
        const url = variant.url || variant.file || variant.api;
        if (!url) throw new Error(`${variant.label} 缺少 url 配置`);
        const response = await fetch(url, {
          cache: "no-store",
          method: variant.method || "GET",
          headers: variant.headers || {},
          credentials: variant.credentials || "same-origin",
          body: variant.body ? JSON.stringify(variant.body) : undefined
        });
        if (!response.ok) throw new Error(`${url} not available`);
        const data = normalizeGraphPayload(await response.json());
        graphCache.set(variant.id, data);
        return data;
      } catch {
        const fallback = window[variant.fallbackKey];
        if (fallback) {
          graphCache.set(variant.id, fallback);
          return fallback;
        }

        if (variant.inlineFallback) {
          const data = JSON.parse(document.querySelector("#fallback-graph-data").textContent);
          graphCache.set(variant.id, data);
          return data;
        }

        throw new Error(`${variant.label} 数据加载失败`);
      }
    }

    function normalizeGraphPayload(payload) {
      if (payload && payload.layers && payload.nodes && payload.modules) return payload;
      if (payload && payload.data && payload.data.layers) return payload.data;
      if (payload && payload.graph && payload.graph.layers) return payload.graph;
      if (payload && payload.data && payload.data.graph && payload.data.graph.layers) return payload.data.graph;
      throw new Error("API 返回的数据不是有效图谱 JSON");
    }

    function renderToolbar() {
      versionSelect.replaceChildren();
      for (const variant of graphVariants) {
        versionSelect.appendChild(el("option", "", {
          value: variant.id,
          text: variant.label
        }));
      }

      versionSelect.addEventListener("change", () => {
        applyGraphVariant(versionSelect.value);
      });
    }

    async function applyGraphVariant(variantId) {
      const variant = graphVariants.find((item) => item.id === variantId) || graphVariants[0];
      versionSelect.value = variant.id;
      const data = await loadGraphData(variant);
      renderOverview(data);
      renderGraph(data);
    }

    function el(tag, className, attrs = {}) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "text") element.textContent = value;
        else if (key === "style") Object.assign(element.style, value);
        else element.setAttribute(key, value);
      }
      return element;
    }

    function makeAssetClickable(element, item, context = {}) {
      element.classList.add("asset-clickable");
      element.setAttribute("tabindex", "0");
      element.setAttribute("role", "button");
      element.setAttribute("aria-label", `查看资产：${item.label || item.id}`);
      const open = (event) => {
        event.stopPropagation();
        openAssetModal(item, context);
      };
      element.addEventListener("click", open);
      element.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          open(event);
        }
      });
    }

    function assetDetailFor(item) {
      const asset = item.asset || {};
      return {
        name: asset.name || "未配置",
        type: asset.type || "其他",
        dependencies: Array.isArray(asset.dependencies) ? asset.dependencies : [],
        links: Array.isArray(asset.links) ? asset.links : [],
        stages: Array.isArray(asset.stages) ? asset.stages : [],
        effect: asset.effect || "未配置",
        implemented: Boolean(asset.implemented),
        note: asset.note || "未配置"
      };
    }

    function addAssetRow(label, valueNode) {
      assetBodyEl.appendChild(el("div", "asset-field-label", { text: label }));
      const value = el("div", "asset-field-value");
      if (typeof valueNode === "string") value.textContent = valueNode;
      else value.appendChild(valueNode);
      assetBodyEl.appendChild(value);
    }

    function emptyValue() {
      return el("span", "asset-empty", { text: "-" });
    }

    function tagList(items) {
      const wrap = el("div", "asset-tags");
      const values = (items || [])
        .map((item) => String(item || "").trim())
        .filter(Boolean);
      if (values.length === 0) return emptyValue();
      for (const item of values) wrap.appendChild(el("span", "asset-tag", { text: item }));
      return wrap;
    }

    function linkList(links) {
      const wrap = el("div", "asset-links");
      const values = (links || []).filter((link) => {
        return link && String(link.url || "").trim();
      });
      for (const link of values) {
        wrap.appendChild(el("a", "", {
          href: link.url,
          target: "_blank",
          rel: "noopener noreferrer",
          text: link.label || link.url
        }));
      }
      if (!wrap.children.length) return emptyValue();
      return wrap;
    }

    function openAssetModal(item, context) {
      const detail = assetDetailFor(item);
      assetTitleEl.textContent = detail.name;
      assetBodyEl.replaceChildren();
      addAssetRow("资产名", detail.name);
      addAssetRow("类型", tagList([detail.type]));
      addAssetRow("依赖", tagList(detail.dependencies));
      addAssetRow("链接", linkList(detail.links));
      addAssetRow("使用阶段", tagList(detail.stages));
      addAssetRow("作用和效果", detail.effect || "-");
      addAssetRow("是否已实现", el("span", `asset-status ${detail.implemented ? "done" : "todo"}`, {
        text: detail.implemented ? "已实现" : "未实现"
      }));
      addAssetRow("备注", detail.note || "-");
      assetModal.classList.add("is-open");
    }

    function closeAssetModal() {
      assetModal.classList.remove("is-open");
    }

    function stageIcon(name) {
      const icons = {
        radar: '<circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 4v3"></path><path d="M12 17v3"></path><path d="M4 12h3"></path><path d="M17 12h3"></path><path d="M12 12l5-5"></path>',
        document: '<path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v5h5"></path><path d="M9.5 12h7"></path><path d="M9.5 16h5"></path>',
        blueprint: '<path d="M5 4h14v16H5z"></path><path d="M8 8h8"></path><path d="M8 12h4"></path><path d="M14 12h2v4h-5v-2"></path><path d="M8 16h1"></path>',
        code: '<path d="M9 8l-4 4 4 4"></path><path d="M15 8l4 4-4 4"></path><path d="M13 5l-2 14"></path>',
        merge: '<circle cx="7" cy="6" r="2"></circle><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle><path d="M7 8v8"></path><path d="M9 6h2a6 6 0 0 1 6 6v4"></path>'
      };
      const svg = document.createElementNS(namespace, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML = icons[name] || icons.document;
      return svg;
    }

    function sequenceArrowIcon() {
      const svg = document.createElementNS(namespace, "svg");
      svg.setAttribute("viewBox", "0 0 44 32");
      svg.setAttribute("aria-hidden", "true");
      const arrow = document.createElementNS(namespace, "path");
      arrow.setAttribute("d", "M3 9 H25 V3 L42 16 L25 29 V23 H3 Z");
      svg.appendChild(arrow);
      return svg;
    }

    function renderGraph(data) {
      graphData = data;
      graphEl.querySelectorAll(".layer, .layer-label").forEach((layer) => layer.remove());
      nodeIndex.clear();

      const layers = [...data.layers].sort((a, b) => a.order - b.order);
      for (const layer of layers) {
        const labelEl = el("div", "layer-label", {
          "data-layer-id": layer.id,
          text: layer.label || ""
        });
        labelEl.style.gridRow = String(layer.order);
        labelEl.style.gridColumn = "1";

        const layerEl = el("div", "layer", {
          "data-id": layer.id,
          "data-frame": String(layer.frame !== false)
        });
        layerEl.style.gridRow = String(layer.order);
        layerEl.style.gridColumn = "2";
        nodeIndex.set(layer.id, layerEl);

        if (layer.frameTitle) {
          layerEl.appendChild(el("div", "layer-frame-title", { text: layer.frameTitle }));
        }

        if (layer.kind === "module-row") renderModules(layerEl, data.modules || []);
        else renderLayerNodes(layerEl, layer, data.nodes.filter((node) => node.layer === layer.id));

        graphEl.appendChild(labelEl);
        graphEl.appendChild(layerEl);
      }

      requestAnimationFrame(drawEdges);
    }

    function renderOverview(data) {
      const flow = data.overview || {
        nodes: ["需求对齐", "方案设计", "编码实现", "问题收敛"]
      };
      const nodes = flow.nodes || [];
      const inner = el("div", "overview-inner");

      overviewEl.replaceChildren();
      nodes.forEach((node, index) => {
        const label = typeof node === "string" ? node : node.label;
        const item = typeof node === "string"
          ? { id: `overview.${index}`, label }
          : node;
        const nodeEl = el("div", "overview-node", { text: label });
        makeAssetClickable(nodeEl, item, { type: "overview" });
        inner.appendChild(nodeEl);
        if (index < nodes.length - 1) inner.appendChild(el("span", "overview-arrow"));
      });
      overviewEl.appendChild(inner);
    }

    function renderLayerNodes(layerEl, layer, nodes) {
      const row = el("div", "row");
      row.style.gridTemplateColumns = `repeat(${layer.slots}, minmax(0, 1fr))`;
      const defaults = layer.nodeDefaults || {};

      for (const node of nodes) {
        const shape = node.shape || defaults.shape || "rect";
        const size = node.size || defaults.size || "medium";
        const isStageOutput = layer.kind === "ellipse-row" && node.icon;
        const nodeEl = el("div", isStageOutput ? "node stage-output" : `node ${shape} ${size}`, {
          "data-id": node.id,
          ...(isStageOutput ? { "data-icon": node.icon } : {})
        });
        if (isStageOutput) {
          nodeEl.appendChild(el("div", "stage-output-label", { text: node.label }));
          const iconWrap = el("div", "stage-output-icon");
          iconWrap.appendChild(stageIcon(node.icon));
          nodeEl.appendChild(iconWrap);
        } else {
          nodeEl.textContent = node.label;
        }
        makeAssetClickable(nodeEl, node, { type: "node", layerId: layer.id });
        nodeEl.style.gridColumn = String(node.slot);
        row.appendChild(nodeEl);
        nodeIndex.set(node.id, nodeEl);
      }

      layerEl.appendChild(row);
    }

    function renderModules(layerEl, modules) {
      const row = el("div", "modules-row");
      const sorted = [...modules].sort((a, b) => a.order - b.order);
      row.style.setProperty("--module-count", sorted.length);
      if (sorted.length > 1) {
        row.classList.add("has-sequence");
        const columns = [];
        for (let index = 0; index < sorted.length; index += 1) {
          columns.push("minmax(0, 1fr)");
          if (index < sorted.length - 1) columns.push("38px");
        }
        row.style.gridTemplateColumns = columns.join(" ");
      }

      sorted.forEach((module, index) => {
        const moduleEl = el("section", "module", { "data-id": module.id });
        makeAssetClickable(moduleEl, module, { type: "module" });
        const title = el("div", "module-title", { text: module.label });
        const grid = el("div", "module-grid");
        grid.style.setProperty("--rows", module.grid.rows);
        grid.style.setProperty("--cols", module.grid.cols);

        for (const node of module.nodes) {
          const textNode = el("div", `node text${node.loop ? " loop-node" : ""}`, {
            "data-id": node.id,
            text: node.label
          });
          textNode.style.gridRow = String(node.row);
          textNode.style.gridColumn = String(node.col);

          if (node.loop) {
            textNode.dataset.loop = "true";
            textNode.appendChild(el("span", "loop-badge", { text: "loop" }));
          }

          makeAssetClickable(textNode, node, {
            type: "node",
            layerId: module.layer,
            moduleId: module.id
          });
          grid.appendChild(textNode);
          nodeIndex.set(node.id, textNode);
        }

        moduleEl.append(title, grid);
        row.appendChild(moduleEl);
        nodeIndex.set(module.id, moduleEl);
        nodeIndex.set(`${module.id}:title`, title);

        if (index < sorted.length - 1) {
          const arrow = el("div", "module-sequence-arrow", {
            "aria-hidden": "true"
          });
          arrow.appendChild(sequenceArrowIcon());
          row.appendChild(arrow);
        }
      });

      layerEl.appendChild(row);
    }

    function drawEdges() {
      const graphBox = graphEl.getBoundingClientRect();
      svgEl.setAttribute("viewBox", `0 0 ${graphBox.width} ${graphBox.height}`);
      svgEl.setAttribute("width", graphBox.width);
      svgEl.setAttribute("height", graphBox.height);
      svgEl.replaceChildren();

      const defs = document.createElementNS(namespace, "defs");
      svgEl.appendChild(defs);
      const markerCache = new Map();

      for (const node of graphData.modules.flatMap((module) => module.nodes)) {
        if (node.loop) drawLoop(node.id, markerCache, defs, graphBox);
      }

      drawStageParabolas(markerCache, defs, graphBox);

      for (const edge of graphData.edges) {
        const fromEl = nodeIndex.get(edge.from);
        const toEl = nodeIndex.get(edge.to);
        if (!fromEl || !toEl) continue;

        const color = edge.color || graphData.layout.theme.defaultEdgeColor;
        const markerId = getMarker(color, markerCache, defs);
        const path = document.createElementNS(namespace, "path");
        path.setAttribute("class", "edge");
        const d = edge.id && edge.id.startsWith("e.asset-")
          ? routeStraightEdge(fromEl, toEl, graphBox, edge.direction)
          : routeEdge(fromEl, toEl, graphBox, edge.direction);
        path.setAttribute("d", d);
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", color === graphData.layout.theme.emphasisEdgeColor ? "1.12" : "1");
        path.setAttribute("marker-end", `url(#${markerId})`);
        svgEl.appendChild(path);
      }
    }

    function drawStageParabolas(markerCache, defs, graphBox) {
      const flows = graphData.stageParabolas || [];
      const color = graphData.layout.theme.defaultEdgeColor;
      const markerId = getMarker(color, markerCache, defs);

      for (const flow of flows) {
        const fromEl = nodeIndex.get(flow.from);
        const viaEl = nodeIndex.get(`${flow.through}:title`);
        const toEl = nodeIndex.get(flow.to);
        if (!fromEl || !viaEl || !toEl) continue;

        const startBox = box(fromEl, graphBox);
        const viaBox = box(viaEl, graphBox);
        const endBox = box(toEl, graphBox);
        const start = { x: startBox.cx, y: startBox.bottom - 2 };
        const vertex = { x: viaBox.cx, y: viaBox.cy };
        const end = { x: endBox.cx, y: endBox.bottom - 2 };
        const control = {
          x: 2 * vertex.x - (start.x + end.x) / 2,
          y: 2 * vertex.y - (start.y + end.y) / 2
        };

        const path = document.createElementNS(namespace, "path");
        path.setAttribute("class", "edge stage-parabola");
        path.setAttribute("d", `M ${start.x} ${start.y} Q ${control.x} ${control.y}, ${end.x} ${end.y}`);
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", "1.08");
        path.setAttribute("marker-end", `url(#${markerId})`);
        svgEl.appendChild(path);
      }
    }

    function getMarker(color, cache, defs) {
      const key = color.replace(/[^a-zA-Z0-9]/g, "");
      const id = `arrow-${key}`;
      if (cache.has(id)) return id;

      const marker = document.createElementNS(namespace, "marker");
      marker.setAttribute("id", id);
      marker.setAttribute("viewBox", "0 0 10 10");
      marker.setAttribute("refX", "8.8");
      marker.setAttribute("refY", "5");
      marker.setAttribute("markerWidth", "9");
      marker.setAttribute("markerHeight", "9");
      marker.setAttribute("orient", "auto-start-reverse");

      const arrow = document.createElementNS(namespace, "path");
      arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      arrow.setAttribute("fill", color);
      marker.appendChild(arrow);
      defs.appendChild(marker);
      cache.set(id, true);
      return id;
    }

    function routeEdge(fromEl, toEl, graphBox, direction) {
      const from = box(fromEl, graphBox);
      const to = box(toEl, graphBox);
      const returnsToOwnModule = toEl.classList.contains("module") && toEl.contains(fromEl);
      if (returnsToOwnModule) return routeChildToModule(from, to, direction);

      const start = anchor(from, direction, true, to, fromEl, toEl);
      const end = anchor(to, direction, false, from, toEl, fromEl);
      const dx = end.x - start.x;
      const dy = end.y - start.y;

      if (direction && direction.includes("up")) {
        const bend = Math.max(34, Math.abs(dy) * 0.42);
        return `M ${start.x} ${start.y} C ${start.x} ${start.y - bend}, ${end.x} ${end.y + bend}, ${end.x} ${end.y}`;
      }

      if (direction && direction.includes("down")) {
        const bend = Math.max(34, Math.abs(dy) * 0.42);
        return `M ${start.x} ${start.y} C ${start.x} ${start.y + bend}, ${end.x} ${end.y - bend}, ${end.x} ${end.y}`;
      }

      if (direction && direction.includes("left")) {
        const bend = Math.max(28, Math.abs(dx) * 0.46);
        return `M ${start.x} ${start.y} C ${start.x - bend} ${start.y}, ${end.x + bend} ${end.y}, ${end.x} ${end.y}`;
      }

      if (direction && direction.includes("right")) {
        const bend = Math.max(28, Math.abs(dx) * 0.46);
        return `M ${start.x} ${start.y} C ${start.x + bend} ${start.y}, ${end.x - bend} ${end.y}, ${end.x} ${end.y}`;
      }

      if (Math.abs(dy) > Math.abs(dx)) {
        const bend = Math.max(26, Math.abs(dy) * 0.38);
        return `M ${start.x} ${start.y} C ${start.x} ${start.y + Math.sign(dy) * bend}, ${end.x} ${end.y - Math.sign(dy) * bend}, ${end.x} ${end.y}`;
      }

      const bend = Math.max(26, Math.abs(dx) * 0.4);
      return `M ${start.x} ${start.y} C ${start.x + Math.sign(dx) * bend} ${start.y}, ${end.x - Math.sign(dx) * bend} ${end.y}, ${end.x} ${end.y}`;
    }

    function routeStraightEdge(fromEl, toEl, graphBox, direction) {
      const from = box(fromEl, graphBox);
      const to = box(toEl, graphBox);
      const start = anchor(from, direction || "down", true, to, fromEl, toEl);
      const end = anchor(to, direction || "down", false, from, toEl, fromEl);
      return `M ${start.x} ${start.y} L ${end.x} ${end.y}`;
    }

    function routeChildToModule(from, moduleRect, direction) {
      const useRightSide = from.cx >= moduleRect.cx;
      const sideX = useRightSide ? moduleRect.right - 16 : moduleRect.left + 16;
      const titleX = moduleRect.cx + (useRightSide ? 46 : -46);
      const titleY = moduleRect.top + 12;
      const sign = useRightSide ? 1 : -1;
      const start = useRightSide
        ? { x: from.right, y: from.cy }
        : { x: from.left, y: from.cy };
      const bottomY = moduleRect.bottom - 16;

      if (direction && direction.includes("up")) {
        const controlY = Math.max(moduleRect.top + 38, Math.min(start.y - 22, moduleRect.bottom - 34));
        return `M ${start.x} ${start.y} C ${sideX} ${start.y - 8}, ${sideX} ${controlY}, ${titleX} ${titleY}`;
      }

      return `M ${start.x} ${start.y} C ${sideX} ${start.y + 10}, ${sideX} ${bottomY}, ${titleX} ${titleY}`;
    }

    function box(element, graphBox) {
      const rect = element.getBoundingClientRect();
      return {
        left: rect.left - graphBox.left,
        top: rect.top - graphBox.top,
        right: rect.right - graphBox.left,
        bottom: rect.bottom - graphBox.top,
        width: rect.width,
        height: rect.height,
        cx: rect.left - graphBox.left + rect.width / 2,
        cy: rect.top - graphBox.top + rect.height / 2
      };
    }

    function anchor(rect, direction, isStart, other, element, otherElement) {
      const horizontal = other.cx - rect.cx;
      const vertical = other.cy - rect.cy;
      const isModule = element && element.classList.contains("module");
      const connectsOwnChild = isModule && otherElement && element.contains(otherElement);

      if (direction && direction.includes("down")) {
        if (isStart && connectsOwnChild) return moduleTitlePort(rect, other);
        if (!isStart && isModule) return { x: containerPortX(rect, other), y: rect.top };
        return isStart
          ? { x: rect.cx, y: rect.bottom }
          : { x: rect.cx, y: rect.top };
      }
      if (direction && direction.includes("up")) {
        if (isStart && isModule) return { x: containerPortX(rect, other), y: rect.top };
        if (!isStart && connectsOwnChild) return moduleTitlePort(rect, other);
        return isStart
          ? { x: rect.cx, y: rect.top }
          : { x: rect.cx, y: rect.bottom };
      }
      if (direction && direction.includes("left")) {
        return isStart
          ? { x: rect.left, y: rect.cy }
          : { x: rect.right, y: rect.cy };
      }
      if (direction && direction.includes("right")) {
        return isStart
          ? { x: rect.right, y: rect.cy }
          : { x: rect.left, y: rect.cy };
      }

      if (Math.abs(vertical) >= Math.abs(horizontal)) {
        return isStart === vertical > 0
          ? { x: rect.cx, y: rect.bottom }
          : { x: rect.cx, y: rect.top };
      }

      return isStart === horizontal > 0
        ? { x: rect.right, y: rect.cy }
        : { x: rect.left, y: rect.cy };
    }

    function containerPortX(rect, other) {
      const margin = Math.min(44, rect.width * 0.24);
      const min = rect.left + margin;
      const max = rect.right - margin;
      const clamped = Math.max(min, Math.min(max, other.cx));
      const titleDeadZone = Math.min(42, rect.width * 0.18);

      if (Math.abs(clamped - rect.cx) < titleDeadZone) {
        return rect.cx + (other.cx >= rect.cx ? titleDeadZone : -titleDeadZone);
      }

      return clamped;
    }

    function moduleTitlePort(rect, other) {
      return {
        x: containerPortX(rect, other),
        y: rect.top + 12
      };
    }

    function drawLoop(nodeId, markerCache, defs, graphBox) {
      const target = nodeIndex.get(nodeId);
      if (!target) return;

      const rect = box(target, graphBox);
      const color = "#b07a38";
      const markerId = getMarker(color, markerCache, defs);
      const padX = 15;
      const padY = 10;
      const left = rect.left - padX;
      const right = rect.right + padX;
      const top = rect.top - padY;
      const bottom = rect.bottom + padY;
      const path = document.createElementNS(namespace, "path");
      path.setAttribute("class", "loop-edge");
      path.setAttribute(
        "d",
        `M ${rect.cx} ${top} C ${right} ${top}, ${right} ${bottom}, ${rect.cx} ${bottom} C ${left} ${bottom}, ${left} ${top}, ${rect.cx - 2} ${top}`
      );
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "0.95");
      path.setAttribute("marker-end", `url(#${markerId})`);
      svgEl.appendChild(path);
    }

    assetCloseEl.addEventListener("click", closeAssetModal);
    assetModal.addEventListener("click", (event) => {
      if (event.target === assetModal) closeAssetModal();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeAssetModal();
    });

    renderToolbar();
    applyGraphVariant(graphVariants[0].id);
    window.addEventListener("resize", () => {
      if (graphData) requestAnimationFrame(drawEdges);
    });
  </script>
</body>
</html>
