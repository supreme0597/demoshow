            <div class="info-actions">
              ${versionSelectHtml}
              <div class="info-meta">${escapeHtml(info.model?.id || info.model?.modelID || 'unknown model')} · ${formatDuration(seconds)} · ${formatTokens(info.tokens)} · ${formatSummary(info.summary)}</div>
              <button class="action-button" type="button" onclick="fileInput.click()">导入 JSON</button>
              <button class="action-button" type="button" onclick="clearCachedSession()">清除</button>
            </div>
          </div>
          <div class="global-progress">
            <div class="progress-track"><div class="progress-fill" style="width:${Math.round(done / total * 100)}%"></div></div>
            <div class="progress-label">总进度 ${done}/${total}</div>
          </div>
        </div>`;
    }

    /* ========== Phase Timeline Rendering ========== */

    function renderPhaseView(viewModel) {
      const phases = viewModel.phases || [];
      if (!phases.length) {
        phaseView.innerHTML = '<div class="empty">未检测到阶段信息</div>';
        return;
      }
      phaseView.innerHTML = renderSessionSummary(viewModel) + phases.map((phase) => renderPhaseCard(phase, viewModel)).join('');
    }

    function renderSessionSummary(viewModel) {
      const session = viewModel.session.info || {};
      const created = session.time?.created || 0;
      const updated = session.time?.updated || created;
      const seconds = created && updated ? Math.max(0, Math.round((updated - created) / 1000)) : 0;
      const phases = viewModel.phases || [];
      const totalSteps = phases.reduce((sum, p) => sum + p.steps.length, 0);
      const totalTools = phases.reduce((sum, p) => sum + p.toolCount + p.skillCount + p.subagentCount, 0);
      const totalFiles = phases.reduce((sum, p) => sum + p.artifacts.length, 0);
      const summary = session.summary || {};

      return `<div class="session-summary">
        <div class="summary-item">
          <span class="summary-label">总耗时</span>
          <span class="summary-value">${formatDuration(seconds)}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">阶段</span>
          <span class="summary-value">${phases.length}</span>
          <span class="summary-sub">${totalSteps} 个执行步骤</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">工具调用</span>
          <span class="summary-value">${totalTools}</span>
          <span class="summary-sub">含 Skill / SubAgent</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">文件变更</span>
          <span class="summary-value">${totalFiles}</span>
          <span class="summary-sub">+${summary.additions || 0}/-${summary.deletions || 0}</span>
        </div>
        ${session.model?.id ? `<div class="summary-item">
          <span class="summary-label">模型</span>
          <span class="summary-sub" style="font-size:13px;font-weight:600">${escapeHtml(session.model.id)}</span>
        </div>` : ''}
      </div>`;
    }

    function renderPhaseCard(phase, viewModel) {
      const total = viewModel.session.info.time?.updated - viewModel.session.info.time?.created || 1;
      const startPos = Math.max(0, ((phase.startedAt - viewModel.session.info.time.created) / total) * 100);
      const width = Math.max(2, ((phase.endedAt - phase.startedAt) / total) * 100);
      const totalArtifacts = phase.artifacts.length;
      const totalTools = phase.toolCount + phase.skillCount + phase.subagentCount;
      const confLabel = { high: '高', medium: '中', low: '低' }[phase.confidence] || '低';
      const isAfterUserInput = phase.steps.some((s) => s.texts.some((t) => t.text?.length > 50));

      const colorMap = {
        '流程启动与意图识别': '#6366f1',
        '项目调研与架构分析': '#3b82f6',
        '任务规划与状态管理': '#f59e0b',
        '环境准备与目录创建': '#8b5cf6',
        '核心文档与方案产出': '#22c55e',
        '变更状态与阶段流转': '#ec4899',
        '设计确认与交付准备': '#14b8a6',
      };
      const color = colorMap[phase.title] || (phase.confidence === 'high' ? '#22c55e' : phase.confidence === 'medium' ? '#f59e0b' : '#9ca3af');

      return `<div class="phase-card ${isAfterUserInput ? 'dimmed' : ''}">
        <div class="phase-header" onclick="this.parentElement.classList.toggle('open')">
          <div class="phase-indicator" style="background:${color}"></div>
          <div class="phase-body">
            <div class="phase-title-row">
              <span class="phase-title">${escapeHtml(phase.title)}</span>
              <span class="conf-badge conf-${phase.confidence}">${confLabel}可信</span>
              <span class="phase-chevron">▶</span>
            </div>
            <div class="phase-bar-row">
              <div class="phase-bar"><div class="phase-fill" style="width:${width}%;margin-left:${startPos}%;background:${color}"></div></div>
              <div class="phase-meta">
                <span>${formatDuration(Math.round((phase.endedAt - phase.startedAt) / 1000))}</span>
                <span>${phase.steps.length} 步</span>
                <span>${totalTools} 次调用</span>
                ${totalArtifacts ? `<span>${totalArtifacts} 个文件</span>` : ''}
              </div>
            </div>
          </div>
        </div>
        <div class="phase-steps">
          ${phase.steps.map((step, i) => renderStep(step, i)).join('')}
          ${phase.todos.length ? `<div style="margin-top:4px;font-size:10px;color:var(--text-secondary)">关联任务：${phase.todos.map((t) => `<span class="step-tool">${escapeHtml(t.content.split(' - ')[0] + (t.status === 'completed' ? '✅' : t.status === 'in_progress' ? '🔄' : '📋'))}</span>`).join(' ')}</div>` : ''}
        </div>
      </div>`;
    }

    function renderStep(step, i) {
      const title = stepTitle(step);
      const hasDetail = step.reasoning.length || step.tools.length || step.skills.length || step.subagents.length || step.texts.length > 1;
      return `<div class="phase-step">
        <div class="step-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="step-title">${escapeHtml(title)}</span>
          <span class="step-right">
            <span class="step-dur">${formatDuration(Math.round(step.duration / 1000))}</span>
            ${step.finishReason ? `<span class="step-reason-badge">${escapeHtml(step.finishReason)}</span>` : ''}
            ${hasDetail ? '<span style="color:var(--text-tertiary);font-size:9px">▶</span>' : ''}
          </span>
        </div>
        ${hasDetail ? `<div class="step-detail">
          ${step.texts.length > 1 ? `<div class="step-texts">${escapeHtml(step.texts[0].text?.slice(0, 200) || '')}${(step.texts[0].text?.length || 0) > 200 ? '...' : ''}</div>` : ''}
          ${step.reasoning.length ? `<div class="step-reasoning">${escapeHtml(step.reasoning.map((r) => r.text?.slice(0, 120)).filter(Boolean).join(' ').slice(0, 300))}</div>` : ''}
          ${step.tools.length ? `<div class="step-tools">${step.tools.map((t) => `<span class="step-tool">${toolIcon(t.tool)} ${escapeHtml(t.state?.title || t.tool || '')}</span>`).join('')}</div>` : ''}
          ${step.skills.length ? `<div class="step-tools">${step.skills.map((t) => `<span class="step-tool">📦 ${escapeHtml(t.state?.input?.name || t.state?.metadata?.name || 'skill')}</span>`).join('')}</div>` : ''}
          ${step.subagents.length ? `<div class="step-tools">${step.subagents.map((t) => `<span class="step-tool">🤖 ${escapeHtml(t.state?.title || 'subagent')}</span>`).join('')}</div>` : ''}
          ${step.artifacts.length ? `<div class="step-artifacts">${step.artifacts.map((a) => `<span class="step-artifact">${artifactIcon(a.status)} ${escapeHtml(shortPath(a.file))}</span>`).join('')}</div>` : ''}
          ${step.tokens?.total ? `<div class="step-tokens">tokens: ${compact(step.tokens.input || 0)} in / ${compact(step.tokens.output || 0)} out / ${compact(step.tokens.reasoning || 0)} reasoning</div>` : ''}
        </div>` : ''}
      </div>`;
    }

    function stepTitle(step) {
      const firstTool = step.tools[0] || step.skills[0] || step.subagents[0];
      if (firstTool) return firstTool.state?.title || firstTool.state?.input?.description || firstTool.state?.metadata?.name || firstTool.tool || '执行步骤';
      const text = step.texts.find((t) => t.text && t.text.length > 20);
      if (text) return text.text.slice(0, 80) + (text.text.length > 80 ? '...' : '');
      return `Step ${step.index + 1}`;
    }

    /* ========== Task Card View ========== */

    function renderBoard(cards) {
      const safeCards = Array.isArray(cards) ? cards : [];
      if (!safeCards.length) {
        selectedCardIndex = 0;
        taskView.innerHTML = '<div class="task-empty">暂无任务内容</div>';
        return;
      }

      selectedCardIndex = Math.min(Math.max(selectedCardIndex, 0), safeCards.length - 1);
      const selectedCard = safeCards[selectedCardIndex];
      taskView.innerHTML = `
        <div class="task-split">
          <aside class="task-header-panel" aria-label="任务列表">
            <div class="task-header-list" role="tablist" aria-label="任务列表">
              ${safeCards.map((card, index) => renderCardHeader(card, index, index === selectedCardIndex)).join('')}
            </div>
          </aside>
          <article class="task-detail ${escapeHtml(selectedCard.todo.status || 'pending')}" role="tabpanel" data-selected-index="${selectedCardIndex}">
            ${renderCardBody(selectedCard)}
          </article>
        </div>`;
    }

    function renderCard(card) {
      return `
        <article class="task-card ${escapeHtml(card.todo.status || 'pending')}">
          ${renderCardHeader(card)}
          ${renderCardBody(card)}
        </article>`;
    }

    function renderCardHeader(card, index = null, selected = false) {
      const state = stateInfo(card.todo.status);
      const isSelectable = index !== null;
      const tag = isSelectable ? 'div' : 'header';
      const attrs = isSelectable
        ? `role="tab" tabindex="0" aria-selected="${selected ? 'true' : 'false'}" onclick="selectTaskCard(${index})" onkeydown="handleTaskHeaderKey(event, ${index})"`
        : '';
      const classes = ['card-header'];
      if (isSelectable) classes.push('task-header-item');
      if (selected) classes.push('is-selected');
      if (card.todo.status) classes.push(escapeHtml(card.todo.status));

      return `
        <${tag} class="${classes.join(' ')}" data-card-index="${isSelectable ? index : ''}" ${attrs}>
          <div class="card-title-row">
            <div class="card-title"><span class="status-dot" style="background:${state.color}"></span><span class="title-text">${escapeHtml(card.taskTitle || card.todo.content || 'Untitled TODO')}</span>${renderSystemLogos(card.todo.content)}</div>
            <span class="status-badge ${card.todo.status === 'pending' ? 'pending' : ''}" style="background:${card.todo.status === 'pending' ? '' : state.color}">${state.label}</span>
          </div>
          <div class="card-progress"><div class="progress-fill" style="width:${state.percent}%;background:${state.color}"></div></div>
        </${tag}>`;
    }

    function renderCardBody(card) {
      return `
        <div class="card-body">
          ${renderTurns(card)}
        </div>`;
    }

    window.selectTaskCard = function(index) {
      const cards = viewModelCache?.cards || [];
      const idx = parseInt(index, 10);
      if (isNaN(idx) || idx < 0 || idx >= cards.length) return;
      if (idx === selectedCardIndex) return;

      selectedCardIndex = idx;
      const selectedCard = cards[selectedCardIndex];
      const headers = taskView.querySelectorAll('.task-header-item');
      headers.forEach((header) => {
        const isSelected = Number(header.dataset.cardIndex) === selectedCardIndex;
        header.classList.toggle('is-selected', isSelected);
        header.setAttribute('aria-selected', isSelected ? 'true' : 'false');
      });

      const detail = taskView.querySelector('.task-detail');
      if (!detail) {
        renderBoard(cards);
        adjustCollapsibleButtons();
        return;
      }
      detail.className = `task-detail ${selectedCard.todo.status || 'pending'}`;
      detail.dataset.selectedIndex = String(selectedCardIndex);
      detail.innerHTML = renderCardBody(selectedCard);
      adjustCollapsibleButtons();
    };

    window.handleTaskHeaderKey = function(event, index) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      selectTaskCard(index);
    };

    function renderTurns(card) {
      if (!card.turns.length) return renderEmptyTurn(card);
      if (card.turns.length <= 2) {
        return card.turns.map((turn, index) => renderTurn(card, turn, index, card.turns.length)).join('');
      }
      
      const firstTurnHtml = renderTurn(card, card.turns[0], 0, card.turns.length);
      const lastIndex = card.turns.length - 1;
      const lastTurnHtml = renderTurn(card, card.turns[lastIndex], lastIndex, card.turns.length);

      // NOTE: 关键决策点智能豁免与物理顺序动态切片折叠算法
      // 遍历中间所有执行回合，如果某回合包含 AI 的阻塞问句（❓）或大型分析详情报告（📄），
      // 则将其判定为核心决策点，从折叠中予以豁免，在折叠块之外以高亮平铺形式直接向用户展现。
      // 为保持时序绝对正确，采用多折叠区物理动态分切机制，连续的普通回合会自适应聚合成独立的折叠块。
      const middleTurns = card.turns.slice(1, -1);
      const htmlSegments = [];
      let pendingNormalTurns = [];

      function renderPendingCollapsed() {
        if (!pendingNormalTurns.length) return '';
        const count = pendingNormalTurns.length;
        const html = `
          <details class="turns-collapsed">
            <summary class="turns-collapsed-summary">
              ⚙️ 展开/隐藏 ${count} 个中间执行回合
            </summary>
            <div class="turns-collapsed-content">
              ${pendingNormalTurns.map(item => renderTurn(card, item.turn, item.index, card.turns.length)).join('')}
            </div>
          </details>
        `;
        pendingNormalTurns = [];
        return html;
      }

      for (let i = 0; i < middleTurns.length; i++) {
        const turn = middleTurns[i];
        const turnIdx = i + 1;

        // 智能侦测：是否包含阻塞问句、详情报告、AI 核心最终结论，或含有 Skill 调用
        const hasQuestion = turn.finalText && (turn.finalText.includes('？') || turn.finalText.includes('?') || turn.finalText.includes('❓'));
        const hasDetails = (turn.finalText || '').length > 200 || (turn.finalText || '').includes('查看详情') || (turn.finalText || '').includes('详情报告');
        // NOTE: 如果某回合执行了 skill 操作（其自身包含 skills 或 tools 中有 skill 调用），应当从折叠中予以豁免，平铺直显
        const hasSkills = (turn.skills && turn.skills.length > 0) || (turn.tools && turn.tools.some(t => t.part?.tool === 'skill' || t.tool === 'skill'));
        const isActionable = hasQuestion || hasDetails || hasSkills;

        if (isActionable) {
          // 遇到豁免核心回合：先把前面累积的普通回合折叠并推入
          htmlSegments.push(renderPendingCollapsed());
          // 紧接着平铺渲染此豁免回合
          htmlSegments.push(renderTurn(card, turn, turnIdx, card.turns.length));
        } else {
          // 普通回合：追加累积等候下一次折叠
          pendingNormalTurns.push({ turn, index: turnIdx });
        }
      }

      // 循环结束后，清空渲染剩余的最后一波累积普通回合
      htmlSegments.push(renderPendingCollapsed());

      return firstTurnHtml + htmlSegments.filter(Boolean).join('') + lastTurnHtml;
    }

    function renderTurn(card, turn, index, totalTurns) {
      const goalHtml = index === 0 && card.taskGoal ? `<div class="message-row user"><div class="bubble user-bubble"><span class="bubble-label">🎯 任务目标</span>${renderLongText(card.taskGoal)}</div><div class="avatar user-avatar">G</div></div>` : '';
      const isLastTurn = index === totalTurns - 1;
      
      // 智能提取并渲染交互式提问/权限申请工具的 AI 提问卡片 + Dev Feedback 用户气泡
      let interactiveBubbles = '';
      const interactiveTools = (turn.tools || []).filter(e => {
        const toolName = e.part?.tool || '';
        return toolName === 'ask_user_question' || toolName === 'question' || toolName.includes('ask_question') || toolName.includes('ask_permission');
      });
      
      interactiveTools.forEach(evt => {
        const toolName = evt.part?.tool || '';
        const inp = evt.part?.state?.input || {};
        const out = evt.part?.state?.output || '';
        
        // --- 1. AI 提问卡片 ---
        if (toolName === 'ask_user_question' || toolName === 'question' || toolName.includes('ask_question')) {
          // 尝试从 input 中提取提问文本（多种数据结构兼容）
          const questionText = inp.question
            || inp.Prompt
            || (inp.questions && inp.questions.length > 0
                ? inp.questions.map(q => q.question || q).join('\n')
                : '')
            || '未知提问';
          
          // 提取选项（如果有的话）
          const options = inp.options
            || (inp.questions && inp.questions[0]?.options)
            || [];
          
          let optionsHtml = '';
          if (options && options.length > 0) {
            optionsHtml = `
              <div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;">
                ${options.map(opt => `<span class="artifact-chip" style="font-size: 11px;">${escapeHtml(opt)}</span>`).join('')}
              </div>`;
          }
          
          interactiveBubbles += `
            <div class="message-row ai" style="margin-top: 10px;">
              <div class="avatar ai-avatar">AI</div>
              <div class="bubble ai-bubble" style="border: 1px solid var(--accent); border-radius: 3px 14px 14px 14px; background: color-mix(in srgb, var(--accent) 5%, var(--bg-secondary));">
                <span class="bubble-label" style="color:var(--accent);">❓ AI 发起提问</span>
                <div style="margin-top: 6px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap;">${escapeHtml(questionText)}</div>
                ${optionsHtml}
              </div>
            </div>
          `;
        } else if (toolName.includes('ask_permission')) {
          // 权限申请卡片
          const action = inp.Action || inp.action || 'Action';
          const target = inp.Target || inp.target || 'Target';
          const reason = inp.Reason || inp.reason || '';
          
          interactiveBubbles += `
            <div class="message-row ai" style="margin-top: 10px;">
              <div class="avatar ai-avatar">AI</div>
              <div class="bubble ai-bubble" style="border: 1px solid var(--warning); border-radius: 3px 14px 14px 14px; background: color-mix(in srgb, var(--warning) 5%, var(--bg-secondary));">
                <span class="bubble-label" style="color:var(--warning);">🛡️ 安全权限申请</span>
                <div style="margin-top: 8px; font-size: 12px; line-height: 1.6;">
                  <div><span style="color:var(--text-secondary);font-weight:600;">操作类型：</span><code style="font-size:11px;">${escapeHtml(action)}</code></div>
                  <div style="margin-top:4px;word-break:break-all;"><span style="color:var(--text-secondary);font-weight:600;">操作目标：</span><code style="font-size:11px;">${escapeHtml(target)}</code></div>
                  ${reason ? `<div style="margin-top:4px;"><span style="color:var(--text-secondary);font-weight:600;">申请原因：</span>${escapeHtml(reason)}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }
        
        // --- 2. Dev Feedback 用户回答气泡 ---
        if (out) {
          let cleanAnswer = getCleanUserAnswer(out);
          if (cleanAnswer.toLowerCase().includes('approved') || cleanAnswer.toLowerCase().includes('authorized')) {
            cleanAnswer = '🟢 [授权核准] 已批准并授权模型继续执行该安全操作。';
          }
          interactiveBubbles += `
            <div class="message-row user" style="margin-top: 8px; margin-bottom: 0;">
              <div class="bubble user-bubble" style="border-radius: 14px 14px 2px 14px; box-shadow: 0 4px 15px rgba(0,113,227,0.1);">
                <span class="bubble-label" style="color:var(--accent);">Dev Feedback</span>
                <div style="margin-top:4px;">${escapeHtml(cleanAnswer)}</div>
              </div>
              <div class="avatar user-avatar">Dev</div>
            </div>
          `;
        }
      });

      return `<section class="turn-block">
        <div class="artifact-title">Turn ${index + 1}</div>
        ${goalHtml}
        ${turn.userMessages.length ? renderUserBubble(turn.userMessages.map((event) => partText(event.part)).join('\n')) : ''}
        ${renderTurnFinalBubble(card, turn, isLastTurn)}
        ${interactiveBubbles}
      </section>`;
    }

    function renderEmptyTurn(card) {
      const className = card.todo.status === 'in_progress' ? 'progress' : 'result';
      const label = card.todo.status === 'pending' ? '📋 待办内容' : '📋 状态';
      return `<div class="message-row ai"><div class="avatar ai-avatar">AI</div><div class="bubble ai-bubble ${className}"><span class="bubble-label">${label}</span>${renderLongText(statusPlaceholder(card.todo.status))}</div></div>`;
    }

    function renderUserBubble(text) {
      const cleaned = cleanUserInput(text);
      return `<div class="message-row user"><div class="bubble user-bubble"><span class="bubble-label">🙋 用户输入</span>${renderLongText(cleaned)}</div><div class="avatar user-avatar">U</div></div>`;
    }

    function renderFinalBubble(card, state) {
      const label = card.todo.status === 'completed' ? '📋 最终成果' : card.todo.status === 'in_progress' ? '📋 当前进展' : '📋 待办内容';
      const className = card.todo.status === 'in_progress' ? 'progress' : 'result';
      return `<div class="message-row ai"><div class="avatar ai-avatar">AI</div><div class="bubble ai-bubble ${className}"><span class="bubble-label">${label}</span>${renderLongText(card.finalText)}${renderArtifacts(card.artifacts)}</div></div>`;
    }

    function renderTurnFinalBubble(card, turn, isLastTurn) {
      const status = isLastTurn ? card.todo.status : 'in_progress';
      const label = status === 'completed' ? '📋 最终成果' : status === 'in_progress' ? '📋 当前进展' : '📋 待办内容';
      const className = status === 'in_progress' ? 'progress' : 'result';
      const flag = turn.flagged;
      const flagLevel = flag?.level || 'error';
      const hasFlag = flag?.isProblematic || flag?.isAccurate;
      const flagBadge = hasFlag
        ? `<span class="flag-badge ${escapeHtml(flagLevel)}" title="${escapeAttr(buildFlagTooltip(flag))}">${flagIcon(flagLevel)}</span>`
        : '';
      const flagClass = hasFlag ? ` flagged-${flagLevel}` : '';

      const { mainText, question } = splitActionableQuestion(turn.finalText);
      
      // NOTE: 检测 finalText 是否为 inferOutcomeFromTurn 产生的占位文字（不含实质内容）
      // 若是，则不在 bubble 主体里渲染这段文字，交由工具按钮区域呈现信息
      const placeholderTexts = ['任务正在处理中。', '任务已完成。', '等待处理。', '任务待处理'];
      const isPlaceholderText = !turn.finalText || placeholderTexts.some(p => turn.finalText.trim() === p) || (turn.finalText.trim().length < 60 && /^(任务进行中|任务已完成|任务待处理|任务正在处理|等待处理)/.test(turn.finalText.trim()));

      let bubbleBodyHtml = '';
      if (!isPlaceholderText) {
        if (question) {
          const id = 'details-doc-' + Math.random().toString(36).slice(2);
          bubbleBodyHtml = `
            <div class="action-question-box">
              <span class="question-emoji">❓</span>
              <span class="question-text">${escapeHtml(question)}</span>
            </div>
            ${mainText ? `
              <div class="artifact-block" style="margin: 6px 0 2px 0;">
                <div class="artifact-list">
                  <span class="artifact-chip" onclick="toggleArtifact('${id}')" style="cursor:pointer; font-weight:700;">📄 查看详情报告 (Markdown)</span>
                </div>
                <div id="${id}" class="skill-markdown-content hidden" style="margin-top: 6px; padding: 10px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; max-height: 250px; overflow-y: auto;">
                  <div class="skill-meta">${renderMarkdown(mainText)}</div>
                </div>
              </div>` : ''}
          `;
        } else {
          const id = 'long-md-' + Math.random().toString(36).slice(2);
          const hasLongText = (turn.finalText || '').length > 200;
          
          if (hasLongText) {
            bubbleBodyHtml = `
              <div class="collapsible-wrapper">
                <div id="${id}" class="collapsible-text" style="-webkit-line-clamp: 3;">${renderMarkdown(turn.finalText)}</div>
                <span class="link-button collapsible-btn" onclick="toggleCollapsibleText('${id}', this)">[展开]</span>
              </div>`;
          } else {
            bubbleBodyHtml = `<div>${renderMarkdown(turn.finalText)}</div>`;
          }
        }
      }

      // NOTE: 为 turn 中的普通工具调用（非交互式）生成可展开的 chip 按钮列表
      // 每个工具调用仅渲染一个 chip 按钮，点击后 inline 展开详情，不自动展开
      const normalToolsForBubble = (turn.tools || []).filter(t => {
        const tool = t.part?.tool || '';
        return tool !== 'todowrite' && !['ask_user_question', 'ask_permission', 'question'].includes(tool) && !tool.includes('ask_question') && !tool.includes('ask_permission');
      });
      let toolChipsHtml = '';
      if (normalToolsForBubble.length > 0) {
        const chips = normalToolsForBubble.map(t => {
          const tool = t.part?.tool || 'tool';
          const title = t.part?.state?.title || t.part?.state?.input?.description || t.part?.state?.metadata?.description || tool;
          const cmd = t.part?.state?.input?.command || t.part?.state?.input?.filePath || t.part?.state?.metadata?.filepath || '';
          const output = t.part?.state?.output || '';
          const id = 'tc-' + Math.random().toString(36).slice(2);
          const icon = toolIcon(tool);
          const shortTitle = title.length > 40 ? title.slice(0, 38) + '…' : title;
          const outputHtml = output
            ? `<pre style="margin:0; white-space:pre-wrap; word-break:break-all; font-size:10.5px; color:#a7f3d0; line-height:1.5; max-height:200px; overflow-y:auto;">${escapeHtml(String(output).slice(0, 3000))}</pre>`
            : `<span style="color:var(--text-muted); font-style:italic; font-size:11px;">[执行完成，无输出]</span>`;
          return `<button class="artifact-chip artifact-button" type="button" onclick="toggleToolChip('${id}')">${icon} ${escapeHtml(shortTitle)}</button><div id="${id}" class="tool-chip-detail hidden"><div class="tool-chip-cmd">${cmd ? `<span style="color:#a5b4fc;">$ </span>${escapeHtml(cmd)}` : `<span style="color:var(--text-muted);">[${escapeHtml(tool)}]</span>`}</div><div class="tool-chip-output">${outputHtml}</div></div>`;
        }).join('');
        toolChipsHtml = `<div class="artifact-block" style="margin-top:6px;"><div class="artifact-title">🛠️ 工具调用</div><div class="artifact-list">${chips}</div></div>`;
      }

      return `<div class="message-row ai"><div class="avatar ai-avatar">AI</div><div class="bubble ai-bubble ${className}${flagClass}">${flagBadge}<span class="bubble-label">${label}</span>${bubbleBodyHtml}${toolChipsHtml}${renderArtifacts(turn.artifacts)}${renderSkillsOnBubble(turn.skills)}${renderTurnTraceability(turn)}</div></div>`;
    }

    function renderArtifacts(artifacts) {
      if (!artifacts.length) return '';
      const chips = artifacts.map((artifact) => {
        const label = `${artifactIcon(artifact.status)} ${escapeHtml(shortPath(artifact.file))}`;
        if (!artifact.patch) return `<span class="artifact-chip">${label}</span>`;
        const id = 'artifact-' + Math.random().toString(36).slice(2);
        return `<button class="artifact-chip artifact-button" type="button" onclick="toggleArtifact('${id}')">${label}</button><div id="${id}" class="artifact-diff hidden"><pre class="diff">${escapeHtml(artifact.patch)}</pre></div>`;
      }).join('');
      return `<div class="artifact-block"><div class="artifact-title">📎 制品</div><div class="artifact-list">${chips}</div></div>`;
    }

    function toggleArtifact(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    // NOTE: 工具调用详情面板开关 - 点击 chip 按钮时展开/收起对应的 tool-chip-detail
    // 同一个 artifact-list 内已展开的其他面板会自动收起，保持简洁
    function toggleToolChip(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const isHidden = el.classList.contains('hidden');
      // 收起同级其他展开的 tool-chip-detail
      const parent = el.closest('.artifact-list');
      if (parent) {
        parent.querySelectorAll('.tool-chip-detail:not(.hidden)').forEach(other => {
          if (other.id !== id) other.classList.add('hidden');
        });
      }
      el.classList.toggle('hidden', !isHidden);
    }

    function renderProcess(card) {
      if (!card.processTexts.length) return '';
      return card.processTexts.slice(0, 3).map((text) => `<div class="message-row ai"><div style="width:24px;flex-shrink:0"></div><div class="bubble ai-bubble"><span class="bubble-label">🤖 AI 过程摘要</span>${renderLongText(text)}</div></div>`).join('');
    }

    function renderTurnProcess(turn) {
      if (!turn.processTexts.length) return '';
      return turn.processTexts.slice(0, 3).map((text) => `<div class="message-row ai"><div style="width:24px;flex-shrink:0"></div><div class="bubble ai-bubble"><span class="bubble-label">🤖 AI 过程摘要</span>${renderLongText(text)}</div></div>`).join('');
    }

    function renderTurnTraceability(turn) {
      const nodes = [];

      // 1. 完整对话节点
      const chatRows = [
        ...(turn.userMessages || []).map((event) => ({ role: '用户', text: cleanUserInput(partText(event.part)) })),
        ...(turn.aiTexts || []).map((event) => ({ role: 'AI', text: partText(event.part) }))
      ];
      if (chatRows.length) {
        const content = chatRows.map(row => `[${row.role}] ${row.text}`).join('\n\n');
        nodes.push(`
          <div class="timeline-node chat" 
               data-tooltip-title="💬 完整对话" 
               data-tooltip-meta="${chatRows.length} 条" 
               data-tooltip-content="${escapeHtml(content)}" 
               onmouseenter="showTimelineTooltipFromData(this)" 
               onmouseleave="hideTimelineTooltip()">
            <span>💬</span>
          </div>`);
      }

      // 2. 思考过程节点
      if (turn.reasoning && turn.reasoning.length) {
        const thoughtContent = turn.reasoning.map(r => partText(r.part)).filter(Boolean).join('\n\n');
        if (thoughtContent.trim()) {
          const charCount = thoughtContent.length;
          nodes.push(`
            <div class="timeline-node thought" 
                 data-tooltip-title="🧠 思考过程" 
                 data-tooltip-meta="${compact(charCount)} 字" 
                 data-tooltip-content="${escapeHtml(thoughtContent)}" 
                 onmouseenter="showTimelineTooltipFromData(this)" 
                 onmouseleave="hideTimelineTooltip()">
              <span>🧠</span>
            </div>`);
        }
      }

      // 3. 过程消息节点
      if (turn.processTexts && turn.processTexts.length) {
        const processContent = turn.processTexts.join('\n\n');
        nodes.push(`
          <div class="timeline-node chat" 
               data-tooltip-title="🤖 过程消息" 
               data-tooltip-meta="${turn.processTexts.length} 次" 
               data-tooltip-content="${escapeHtml(processContent)}" 
               onmouseenter="showTimelineTooltipFromData(this)" 
               onmouseleave="hideTimelineTooltip()">
            <span>🤖</span>
          </div>`);
      }

      // 4. 普通工具调用节点（过滤排除 skill 后的调用）
      const normalTools = (turn.tools || []).filter(t => t.part?.tool !== 'skill');
      for (const toolEvent of normalTools) {
        const part = toolEvent.part || {};
        const toolName = part.tool || 'tool';
        const title = part.state?.title || part.title || part.state?.metadata?.description || part.state?.input?.description || toolName;
        const output = part.state?.output || part.state?.metadata?.output || '';
        
        let classType = 'bash';
        let icon = '🛠️';
        if (toolName === 'read' || toolName === 'read_file' || toolName === 'view_file') {
          classType = 'read';
          icon = '📖';
        } else if (toolName === 'write' || toolName === 'write_to_file' || toolName === 'edit' || toolName === 'replace_file_content' || toolName === 'multi_replace_file_content') {
          classType = 'write';
          icon = '✏️';
        } else if (toolName === 'bash' || toolName === 'run_command') {
          classType = 'bash';
          icon = '💻';
        }
        
        const tooltipContent = `工具: ${toolName}\n描述: ${title}${output ? `\n\n[输出结果]\n${output}` : ''}`;
        
        nodes.push(`
          <div class="timeline-node ${classType}" 
               data-tooltip-title="${icon} 工具: ${escapeHtml(toolName)}" 
               data-tooltip-meta="工具调用" 
               data-tooltip-content="${escapeHtml(tooltipContent)}" 
               onmouseenter="showTimelineTooltipFromData(this)" 
               onmouseleave="hideTimelineTooltip()">
            <span>${icon}</span>
          </div>`);
      }

      // 5. 子代理节点
      const subagents = turn.subagents || [];
      for (const agentEvent of subagents) {
        const part = agentEvent.part || {};
        const title = part.state?.title || 'subagent';
        const output = part.state?.output || part.state?.metadata?.output || '';
        const tooltipContent = `子代理: ${title}${output ? `\n\n[输出结果]\n${output}` : ''}`;
        nodes.push(`
          <div class="timeline-node agent" 
               data-tooltip-title="🤖 子代理: ${escapeHtml(title)}" 
               data-tooltip-meta="子代理协作" 
               data-tooltip-content="${escapeHtml(tooltipContent)}" 
               onmouseenter="showTimelineTooltipFromData(this)" 
               onmouseleave="hideTimelineTooltip()">
            <span>🤖</span>
          </div>`);
      }

      if (!nodes.length) return '';

      return `
        <div class="trace-timeline">
          <span class="timeline-label">操作轨迹</span>
          <div class="timeline-line"></div>
          <div class="timeline-nodes">
            ${nodes.join('')}
          </div>
        </div>`;
    }

    function renderTraceability(card) {
      const dummyTurn = {
        userMessages: card.userTexts || [],
        aiTexts: card.aiTexts || [],
        reasoning: card.reasoning || [],
        tools: card.tools || [],
        subagents: card.subagents || [],
        processTexts: []
      };
      return renderTurnTraceability(dummyTurn);
    }

    function renderSkillsOnBubble(skills) {
      if (!skills.length) return '';
      const chips = skills.map((event) => {
        const part = event.part || {};
        const state = part.state || {};
        const name = state.input?.name || state.metadata?.name || 'skill';
        const id = 'skill-b-' + Math.random().toString(36).slice(2);
        return `<button class="artifact-chip artifact-button" type="button" onclick="toggleArtifact('${id}')">📦 ${escapeHtml(name)}</button><div id="${id}" class="artifact-diff hidden">${renderSkillTool(part)}</div>`;
      }).join('');
      return `<div class="artifact-block"><div class="artifact-title">📦 Skill 调用</div><div class="artifact-list">${chips}</div></div>`;
    }

    function renderTurnConversationTrace(turn) {
      const rows = [
        ...turn.userMessages.map((event) => ({ role: '用户', text: cleanUserInput(partText(event.part)), raw: partText(event.part) })),
        ...turn.aiTexts.map((event) => ({ role: 'AI', text: partText(event.part) }))
      ];
      if (!rows.length) return '';
      return `<details class="nested"><summary>💬 完整对话 · ${rows.length}条</summary><div class="nested-content">${rows.map((row) => `<div class="inline-message">[${row.role}] ${renderLongText(row.text, 90)}${row.raw && row.raw !== row.text ? `<details><summary>查看原始输入</summary><pre class="diff">${escapeHtml(row.raw)}</pre></details>` : ''}</div>`).join('')}</div></details>`;
    }

    function renderConversationTrace(card) {
      const rows = [
        ...card.userTexts.map((event) => ({ role: '用户', text: cleanUserInput(partText(event.part)), raw: partText(event.part) })),
        ...card.aiTexts.map((event) => ({ role: 'AI', text: partText(event.part) }))
      ];
      if (!rows.length) return '';
      return `<details class="nested"><summary>💬 完整对话 · ${rows.length}条</summary><div class="nested-content">${rows.map((row) => `<div class="inline-message">[${row.role}] ${renderLongText(row.text, 90)}${row.raw && row.raw !== row.text ? `<details><summary>查看原始输入</summary><pre class="diff">${escapeHtml(row.raw)}</pre></details>` : ''}</div>`).join('')}</div></details>`;
    }

    function renderNested(title, events, renderFn) {
      if (!events.length) return '';
      return `<details class="nested"><summary>${title} · ${events.length}次</summary><div class="nested-content">${events.map(renderFn).join('')}</div></details>`;
    }

    function renderTool(event) {
      const part = event.part || {};
      if (part.tool === 'skill') return renderSkillTool(part);
      const title = part.state?.title || part.title || part.state?.metadata?.description || part.state?.input?.description || part.tool || 'tool';
      const output = part.state?.output || part.state?.metadata?.output || '';
      let outputHtml = '';
      if (output) {
        if (part.tool === 'task') {
          outputHtml = `<details><summary style="cursor:pointer">查看输出</summary><div style="margin-top:6px;padding:10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;max-height:350px;overflow-y:auto;font-size:11px;line-height:1.6;color:var(--text-secondary);">${renderMarkdown(String(output))}</div></details>`;
        } else {
          outputHtml = `<details><summary style="cursor:pointer">查看输出</summary><pre class="diff">${escapeHtml(String(output).slice(0, 4000))}</pre></details>`;
        }
      }
      return `<div><strong>${toolIcon(part.tool)} ${escapeHtml(part.tool || 'tool')}</strong>: ${escapeHtml(title)}${outputHtml}</div>`;
    }

    function renderSkillTool(part) {
      const state = part.state || {};
      const name = state.input?.name || state.metadata?.name || 'unknown-skill';
      const dir = state.metadata?.dir || '';
      const output = String(state.output || '');
      const summary = extractSkillSummary(output, name);
      const url = skillUrl(name);
      return `<div class="skill-box">
        <div class="skill-title">
          <span>📦 skill: ${escapeHtml(name)}</span>
          ${url ? `<a class="skill-link" href="${escapeAttr(url)}" target="_blank" rel="noreferrer">skills.sh ↗</a>` : `<span style="color:var(--text-tertiary);font-weight:500">暂无公开链接</span>`}
        </div>
        <div class="skill-meta">${renderMarkdown(summary)}</div>
        ${dir ? `<div class="skill-meta">本地路径：${escapeHtml(dir)}</div>` : ''}
        ${output ? `<details><summary style="font-size:9px;color:var(--text-secondary);cursor:pointer">查看技能完整内容</summary><div class="skill-meta" style="margin-top:6px">${renderMarkdown(stripSkillWrapper(output))}</div></details>` : ''}
      </div>`;
    }

    function stripSkillWrapper(text) {
      return String(text || '').replace(/<skill_content[^>]*>/g, '').replace(/<\/skill_content>/g, '').trim();
    }

    function splitActionableQuestion(text) {
      if (!text || typeof text !== 'string') return { mainText: '', question: '' };
      const trimmed = text.trim();
      
      // 如果总体文字很短，不需要剥离问句
      if (trimmed.length < 150) {
        return { mainText: trimmed, question: '' };
      }

      // 将文本按换行切分，查找最后几段
      const paragraphs = trimmed.split(/\n+/).map(p => p.trim()).filter(Boolean);
      if (paragraphs.length >= 2) {
        const lastPara = paragraphs[paragraphs.length - 1];
        
        // 判断最后一段是否为决策确认性问句
        const isQuestion = lastPara.endsWith('?') || lastPara.endsWith('？');
        const hasDecisionKeywords = /(是否|确认|执行|推进|决策|开始|选择|哪种)/.test(lastPara);
        
        if (lastPara.length < 120 && (isQuestion || hasDecisionKeywords)) {
          const mainText = paragraphs.slice(0, -1).join('\n\n');
          return { mainText, question: lastPara };
        }
      }
      return { mainText: trimmed, question: '' };
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      
      // 代码块和标题、粗斜体等标准解析
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre class="diff"><code>$2</code></pre>');
      html = html.replace(/^#### (.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
      html = html.replace(/^---+\s*$/gm, '<hr>');

      // 表格解析
      const lines = html.split('\n');
      let inTable = false;
      let tableHtml = '';
      const processedLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
          const cells = line.split('|').map(c => c.trim()).filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
          
          // 检测下一行是否是表格分割行 (如 |---|---|)
          const nextLine = (lines[i + 1] || '').trim();
          const isSeparator = nextLine.startsWith('|') && nextLine.includes('-') && nextLine.endsWith('|');
          
          if (!inTable && isSeparator) {
            inTable = true;
            tableHtml = '<table class="markdown-table"><thead><tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
            i++; // 跳过分割行
            continue;
          }
          
          if (inTable) {
            tableHtml += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
            continue;
          }
        }
        
        if (inTable) {
          tableHtml += '</tbody></table>';
          processedLines.push(tableHtml);
          inTable = false;
        }
        
        processedLines.push(lines[i]);
      }
      
      if (inTable) {
        tableHtml += '</tbody></table>';
        processedLines.push(tableHtml);
      }

      html = processedLines.join('\n');
      html = html.replace(/\n\n/g, '</p><p>');
      html = html.replace(/\n/g, '<br>');
      return '<p>' + html + '</p>';
    }

    function extractSkillSummary(output, name) {
      const body = stripSkillWrapper(output);
      if (!body) return '已调用技能。';
      const lines = body.split('\n').map((line) => line.trim()).filter(Boolean);
      const heading = lines.find((line) => line.startsWith('# ') && !line.toLowerCase().includes(`skill: ${String(name).toLowerCase()}`));
      if (heading) return heading.slice(0, 220);
      const nonMeta = lines.find((line) => !line.startsWith('#') && !line.startsWith('---') && !line.startsWith('Base directory'));
      return (nonMeta || `Skill ${name}`).slice(0, 220);
    }

    function skillUrl(name) {
      const map = {
        brainstorming: 'obra/superpowers',
        'dispatching-parallel-agents': 'obra/superpowers',
        'executing-plans': 'obra/superpowers',
        'finishing-a-development-branch': 'obra/superpowers',
        'receiving-code-review': 'obra/superpowers',
        'requesting-code-review': 'obra/superpowers',
        'subagent-driven-development': 'obra/superpowers',
        'systematic-debugging': 'obra/superpowers',
        'test-driven-development': 'obra/superpowers',
        'using-git-worktrees': 'obra/superpowers',
        'using-superpowers': 'obra/superpowers',
        'verification-before-completion': 'obra/superpowers',
        'writing-plans': 'obra/superpowers',
        'writing-skills': 'obra/superpowers',
        'frontend-design': 'anthropics/skills',
        'skill-creator': 'anthropics/skills',
        'find-skills': 'vercel-labs/skills'
      };
      const source = map[name];
      return source ? `https://skills.sh/${source}/${encodeURIComponent(name)}` : '';
    }

    function renderLongText(text) {
      if (!text) return '';
      const id = 'long-' + Math.random().toString(36).slice(2);
      return `<div class="collapsible-wrapper">
        <div id="${id}" class="collapsible-text">${escapeHtml(text)}</div>
        <span class="link-button collapsible-btn hidden" onclick="toggleCollapsibleText('${id}', this)">[展开]</span>
      </div>`;
    }

    function toggleCollapsibleText(id, trigger) {
      const el = document.getElementById(id);
      if (!el) return;
      const expanded = el.classList.toggle('expanded');
      trigger.textContent = expanded ? '[收起]' : '[展开]';
    }

    function adjustCollapsibleButtons() {
      const texts = document.querySelectorAll('.collapsible-text');
      texts.forEach((el) => {
        const btn = el.nextElementSibling;
        if (btn && btn.classList.contains('collapsible-btn')) {
          if (el.scrollHeight > el.clientHeight) {
            btn.classList.remove('hidden');
          } else {
            if (!el.classList.contains('expanded')) {
              btn.classList.add('hidden');
            }
          }
        }
      });
    }

    function renderEmptyUser() { return '<div class="empty">暂无关联用户输入</div>'; }
    function partText(part) { return part?.text || part?.state?.input?.content || part?.state?.output || ''; }
    function cleanUserInput(text) {
      const value = String(text || '').trim();
      if (!value) return '';

      const invocationMatch = value.match(/Use the invocation arguments below as the user input for this workflow:\s*```(?:text)?\s*([\s\S]*?)```/i);
      if (invocationMatch) return invocationMatch[1].trim();

      const pastedMatch = value.match(/^\[Pasted[^\]]*\]\s*([\s\S]*)$/i);
      if (pastedMatch && pastedMatch[1].trim()) return pastedMatch[1].trim();

      const commandMatch = value.match(/^Equivalent\s+[^\n]+\nCommand name:[^\n]+\n[\s\S]*?```(?:text)?\s*([\s\S]*?)```/i);
      if (commandMatch) return commandMatch[1].trim();

      return value;
    }
    function statusPlaceholder(status) { return status === 'pending' ? '等待处理。' : status === 'in_progress' ? '任务正在处理中。' : '任务已完成。'; }
    function stateInfo(status) {
      if (status === 'completed') return { label: '✅ 已完成', color: 'var(--success)', percent: 100 };
      if (status === 'in_progress') return { label: '🔄 进行中', color: 'var(--warning)', percent: 40 };
      return { label: '📋 待办', color: 'var(--text-tertiary)', percent: 0 };
    }
    function formatDuration(seconds) { return seconds >= 60 ? `${Math.floor(seconds / 60)}m ${seconds % 60}s` : `${seconds}s`; }
    function formatTokens(tokens = {}) { return `${compact(tokens.input || 0)} in / ${compact(tokens.output || 0)} out`; }
    function formatSummary(summary = {}) { return `+${summary.additions || 0}/-${summary.deletions || 0} · ${summary.files || 0} files`; }
    function compact(n) { return n >= 1000 ? `${(n / 1000).toFixed(1)}K` : String(n); }
    function artifactIcon(status) {
      if (status === 'added') return '➕';
      if (status === 'deleted') return '🗑️';
      if (status === 'read') return '📖';
      return '✏️';
    }
    function toolIcon(tool) { return ({ skill: '📦', bash: '💻', task: '🤖', todowrite: '✅', write: '✏️', edit: '✏️', read: '📖', glob: '🔍', grep: '🔍' })[tool] || '🛠️'; }
    function shortPath(path) { return String(path || '').split('/').slice(-2).join('/'); }
    function artifactKey(path) {
      const normalized = String(path || '').replace(/\\/g, '/');
      if (normalized.startsWith('openspec/')) return normalized;
      const marker = '/openspec/';
      if (normalized.includes(marker)) return 'openspec/' + normalized.split(marker).pop();
      return normalized.split('/').slice(-3).join('/');
    }
    // NOTE: 智能提取交互工具反馈 output 中等号 "=" 后面的真实用户答案，剥离提问与系统格式。完美支持多等号（多提问）边界。
    function getCleanUserAnswer(out) {
      if (!out) return '';
      let s = out.replace(/^User has answered your questions:\s*/i, '').trim();
      
      const regex = /="([^"]+)"/g;
      const matches = [];
      let match;
      while ((match = regex.exec(s)) !== null) {
        matches.push(match[1].trim());
      }
      
      if (matches.length > 0) {
        return matches.join(' ｜ ');
      }
      
      if (s.includes('=')) {
        const parts = s.split('=');
        let ans = parts[parts.length - 1].trim();
        if (ans.startsWith('"') && ans.endsWith('"')) {
          ans = ans.substring(1, ans.length - 1).trim();
        }
        return ans;
      }
      return s;
    }

    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]); }
    function escapeAttr(value) { return escapeHtml(value).replace(/\n/g, '&#10;'); }

    /* ========== Error Signal Detection ========== */

    function containsAccuracyPraise(text) {
      return String(text || '').includes('你的输出非常准确');
    }

    function containsErrorComplaint(text) {
      return String(text || '').includes('你的生成有问题');
    }

    function buildFlagTooltip(flag) {
      if ((!flag?.isProblematic && !flag?.isAccurate) || !flag.signals?.length) return '';
      const levelLabel = { error: '错误', accurate: '准确' }[flag.level] || '提示';
      const reasons = flag.signals.map(s => s.detail).join('; ');
      return `[${levelLabel}] ${reasons}`;
    }

    function flagIcon(level) {
      if (level === 'error') return '✕';
      if (level === 'accurate') return '✓';
      return 'ℹ';
    }

    function detectErrorSignals(cards) {
      if (!cards || !cards.length) return;
      const orderedTurns = flattenTurns(cards);

      for (let ci = 0; ci < cards.length; ci++) {
        const card = cards[ci];
        if (!card.turns || !card.turns.length) continue;

        for (let ti = 0; ti < card.turns.length; ti++) {
          const turn = card.turns[ti];

          turn.flagged = {
            isProblematic: false,
            isAccurate: false,
            level: null,
            confidence: null,
            signals: [],
          };

          if (!turn.finalText) {
            continue;
          }

          const nextUserTurn = findNextUserTurn(orderedTurns, card, ti);
          if (nextUserTurn) {
            const userText = getUserTextFromTurn(nextUserTurn);
            if (userText) {
              if (containsAccuracyPraise(userText) && findPreviousAiTurn(orderedTurns, nextUserTurn) === turn) {
                turn.flagged.isAccurate = true;
                turn.flagged.signals.push({
                  type: 'user_accuracy_praise',
                  detail: '用户下一条消息包含“你的输出非常准确”',
                  keyword: '你的输出非常准确',
                  category: 'accuracy_praise',
                  language: 'zh',
                });
              }

              if (containsErrorComplaint(userText) && findPreviousAiTurn(orderedTurns, nextUserTurn) === turn) {
                turn.flagged.isProblematic = true;
                turn.flagged.signals.push({
                  type: 'user_error_complaint',
                  detail: '用户下一条消息包含“你的生成有问题”',
                  keyword: '你的生成有问题',
                  category: 'error_complaint',
                  language: 'zh',
                });
              }
            }
          }
        }

        for (const turn of card.turns) {
          if (!turn.flagged?.isProblematic && !turn.flagged?.isAccurate) continue;
          if (turn.flagged.isProblematic) {
            turn.flagged.level = 'error';
            turn.flagged.confidence = 'high';
          } else {
            turn.flagged.level = 'accurate';
            turn.flagged.confidence = 'high';
          }
        }
      }
    }

    function getUserTextFromTurn(turn) {
      if (!turn) return '';
      return turn.userMessages.map(e => e.part?.text || e.part?.state?.output || '').join(' ').trim();
    }

    function flattenTurns(cards) {
      const turns = [];
      for (let ci = 0; ci < cards.length; ci++) {
        const card = cards[ci];
        for (let ti = 0; ti < (card.turns || []).length; ti++) {
          turns.push({ card, cardIndex: ci, turn: card.turns[ti], turnIndex: ti });
        }
      }
      return turns;
    }

    function findTurnPosition(orderedTurns, card, turnIndex) {
      return orderedTurns.findIndex((item) => item.card === card && item.turnIndex === turnIndex);
    }

    function findNextUserTurn(orderedTurns, card, fromIndex) {
      const start = findTurnPosition(orderedTurns, card, fromIndex);
      if (start < 0) return null;
      for (let i = start + 1; i < orderedTurns.length; i++) {
        if (getUserTextFromTurn(orderedTurns[i].turn)) return orderedTurns[i].turn;
      }
      return null;
    }

    function findPreviousAiTurn(orderedTurns, beforeTurn) {
      const start = orderedTurns.findIndex((item) => item.turn === beforeTurn);
      if (start < 0) return null;
      for (let i = start - 1; i >= 0; i--) {
        if (orderedTurns[i].turn.finalText) return orderedTurns[i].turn;
      }
      return null;
    }

    // 全局 Tooltip 辅助控制逻辑
    let tooltipTimeout = null;

    function showTimelineTooltip(element, title, meta, content) {
      if (tooltipTimeout) {
        clearTimeout(tooltipTimeout);
        tooltipTimeout = null;
      }
      
      let tooltip = document.getElementById('global-timeline-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'global-timeline-tooltip';
        tooltip.className = 'global-timeline-tooltip';
        tooltip.innerHTML = `
          <div class="tooltip-header">
            <span id="global-tooltip-title" class="tooltip-title"></span>
            <span id="global-tooltip-meta" class="tooltip-meta"></span>
          </div>
          <div id="global-tooltip-content" class="tooltip-content"></div>
        `;
        document.body.appendChild(tooltip);
      }

      const titleEl = document.getElementById('global-tooltip-title');
      const metaEl = document.getElementById('global-tooltip-meta');
      const contentEl = document.getElementById('global-tooltip-content');

      titleEl.textContent = title;
      metaEl.textContent = meta;
      contentEl.textContent = content;

      tooltip.style.display = 'flex';
      tooltip.style.visibility = 'hidden';
      tooltip.classList.add('visible');
      
      const rect = element.getBoundingClientRect();
      const tooltipWidth = tooltip.offsetWidth || 300;
      const tooltipHeight = tooltip.offsetHeight || 150;

      // 默认在节点上方居中弹出
      let left = rect.left + (rect.width - tooltipWidth) / 2;
      let top = rect.top - tooltipHeight - 8;

      // 防止左右溢出屏幕可视区域
      if (left < 12) {
        left = 12;
      } else if (left + tooltipWidth > window.innerWidth - 12) {
        left = window.innerWidth - tooltipWidth - 12;
      }

      // 防止冲顶裁剪，如果上方空间不足则向下弹出
      if (top < 12) {
        top = rect.bottom + 8;
      }

      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
      tooltip.style.visibility = 'visible';

      tooltip.onmouseenter = () => {
        if (tooltipTimeout) {
          clearTimeout(tooltipTimeout);
          tooltipTimeout = null;
        }
      };
      tooltip.onmouseleave = () => {
        hideTimelineTooltip();
      };
    }

    function showTimelineTooltipFromData(element) {
      const title = element.getAttribute('data-tooltip-title') || '';
      const meta = element.getAttribute('data-tooltip-meta') || '';
      const content = element.getAttribute('data-tooltip-content') || '';
      showTimelineTooltip(element, title, meta, content);
    }

    function hideTimelineTooltip() {
      tooltipTimeout = setTimeout(() => {
        const tooltip = document.getElementById('global-timeline-tooltip');
        if (tooltip) {
          tooltip.classList.remove('visible');
          tooltip.style.visibility = 'hidden';
        }
      }, 120);
    }
  </script>
</body>
